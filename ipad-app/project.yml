name: KalpanaDrive
options:
  bundleIdPrefix: com.ashutoshsingh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  KalpanaDriveCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KalpanaDriveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive.core
        GENERATE_INFOPLIST_FILE: YES

  KalpanaDriveApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/KalpanaDriveApp
    dependencies:
      - target: KalpanaDriveCore
    info:
      path: KalpanaDriveApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive
        PRODUCT_NAME: Kalpana Drive
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets: []
      gatherCoverageData: false
