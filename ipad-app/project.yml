name: KalpanaDrive
options:
  bundleIdPrefix: com.ashutoshsingh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  KalpanaDriveCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KalpanaDriveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive.core
        GENERATE_INFOPLIST_FILE: YES

  KalpanaDriveApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/KalpanaDriveApp
    dependencies:
      - target: KalpanaDriveCore
    info:
      path: KalpanaDriveApp/Info.plist
      properties:
        CFBundleDisplayName: Kalpana Drive
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Kalpana Drive uses the iPad's location for the live map, driving speed, route guidance, trip recording, and parking location.
        NSContactsUsageDescription: "Kalpana Drive uses contacts stored on this iPad to let you search people and start calls."
        NSMicrophoneUsageDescription: Kalpana Drive uses the microphone only when you activate voice control.
        NSSpeechRecognitionUsageDescription: Kalpana Drive converts your spoken driving commands into text on request.
        NSLocalNetworkUsageDescription: Kalpana Drive connects directly to your nearby iPhone companion for approved contacts, Apple Music control, destinations, location, and device health.
        NSBonjourServices:
          - _kalpana-drive._tcp
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive
        PRODUCT_NAME: Kalpana Drive
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "87V22WR64U"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - KalpanaDriveCoreTests
      gatherCoverageData: true

  KalpanaDriveCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KalpanaDriveCoreXCTests
    dependencies:
      - target: KalpanaDriveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive.coretests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
