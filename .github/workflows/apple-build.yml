name: Apple builds

on:
  push:
    branches:
      - main
      - agent/remove-simulated-services
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen >/dev/null

      - name: Generate Xcode projects
        run: chmod +x scripts/*.sh && ./scripts/generate-projects.sh

      - name: Run core checks
        run: ./scripts/test.sh

      - name: Build iPad application
        id: ipad_build
        continue-on-error: true
        run: ./scripts/build.sh > ipad-build.log 2>&1

      - name: Extract iPad compiler errors
        if: steps.ipad_build.outcome == 'failure'
        run: |
          grep -E "(^|[[:space:]])(error|warning):|:[0-9]+:[0-9]+: error:" ipad-build.log > ipad-errors.txt || tail -n 200 ipad-build.log > ipad-errors.txt
          cat ipad-errors.txt

      - name: Build iPhone companion
        id: iphone_build
        continue-on-error: true
        run: ./scripts/build-iphone.sh > iphone-build.log 2>&1

      - name: Extract iPhone compiler errors
        if: steps.iphone_build.outcome == 'failure'
        run: |
          grep -E "(^|[[:space:]])(error|warning):|:[0-9]+:[0-9]+: error:" iphone-build.log > iphone-errors.txt || tail -n 200 iphone-build.log > iphone-errors.txt
          cat iphone-errors.txt

      - name: Upload Apple build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: |
            ipad-build.log
            ipad-errors.txt
            iphone-build.log
            iphone-errors.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when an Apple target does not compile
        if: steps.ipad_build.outcome == 'failure' || steps.iphone_build.outcome == 'failure'
        run: exit 1
