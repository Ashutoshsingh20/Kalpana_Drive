name: Apple builds

on:
  push:
    branches:
      - main
      - agent/remove-simulated-services
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode projects
        run: chmod +x scripts/*.sh && ./scripts/generate-projects.sh

      - name: Run core checks
        run: ./scripts/test.sh

      - name: Build iPad application
        run: ./scripts/build.sh

      - name: Build iPhone companion
        run: ./scripts/build-iphone.sh
