name: KalpanaDrivePhone
options:
  bundleIdPrefix: com.ashutoshsingh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  KalpanaDrivePhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Kalpana Drive Phone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: Kalpana Drive Phone shares location only when you explicitly enable companion location sharing.
        NSLocalNetworkUsageDescription: Kalpana Drive Phone uses the local network to find and connect to your trusted iPad.
        NSBonjourServices:
          - _kalpana-drive._tcp
          - _kalpana-drive._udp
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashutoshsingh.kalpanadrive.phone
        PRODUCT_NAME: Kalpana Drive Phone
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      gatherCoverageData: false
